---
- name: Install and configure Apache web server
  hosts: webservers
  become: yes
  gather_facts: yes
    
  tasks:
   - name: Update apt cache
     ansible.builtin.apt:
      update_cache: yes
      cache_valid_time: 3600
     when: ansible_os_family == "Debian"

   - name: Install Apache
     ansible.builtin.apt:
      name: "{{webserverondebian}}"
      state: present
     when: ansible_os_family == "Debian"

   - name: Ensure Apache is running and enabled
     ansible.builtin.service:
      name: "{{webserverondebian}}"
      state: started
      enabled: yes
     when: ansible_os_family == "Debian"
   
   - name: Update Apache default web page
     ansible.builtin.copy:
      dest: /var/www/html/index.html
      content: | 
       <!DOCTYPE html>
       <html lang="en">
        <head>
         <meta charset="UTF-8">
         <title>DevOps Ansible Lab</title>
        </head>
        <body>
          <h1>Apache configured by Ansible</h1>
          <p>The web server is running successfully.</p>
        </body>
       </html>
      owner: root
      group: root
      mode: "0644" 
     when: ansible_os_family == "Debian"
   - name: Install webserver on redhat nodes (yum install httpd)
     yum:
      name: "{{webserveronredhat}}"
      state: present
     when: ansible_os_family == "RedHat"
   - name: Start webserver on RedHat node (service httpd start)
     service:
      name: "{{webserveronredhat}}"
      state: started
     when: ansible_os_family == "RedHat"
