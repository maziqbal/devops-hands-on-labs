apiVersion: apps/v1
kind: Deployment
metadata: 
  name: myjavaapp-deploy
  namespace: production
  labels:
    app: myjavaapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myjavaapp
  template:
    metadata  :
      labels:
        app: myjavaapp
    spec:
      containers:
        - name: myjavaapp
          image: 493392057026.dkr.ecr.us-east-1.amazonaws.com/webdevmz:1
          ports:
            - containerPort: 8080
