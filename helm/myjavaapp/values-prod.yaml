# Prod: 3 pods, private ECR image, AWS LoadBalancer
# Needs the ecr-secret in the production namespace first (see HELM_LAB.md)
# helm install booking-prod ./myjavaapp -f ./myjavaapp/values-prod.yaml -n production --create-namespace

replicaCount: 4

image:
  repository: 493392057026.dkr.ecr.us-east-1.amazonaws.com/webdevmz
  tag: "2"
  pullPolicy: Always

imagePullSecrets:
  - name: ecr-secret

service:
  type: LoadBalancer
  nodePort: null      # null removes the default 30002; AWS gives an external URL instead
