---
- hosts: node1
  become: yes
  tasks:
    - include_tasks: create-file.yml
    - name: install apache2 webserver
      apt:
       name: apache2
       state: present
    - name: Create a folder
      file:
       path: /home/maha/devops-labs
       state: directory
    - name: Copy a static file to remote machine
      copy:
       src: files/devops-info.txt
       dest: /home/maha/devops-labs/devops-info.txt
      notify: RestartApacheWebServer

    - name: Create and copy a dynamic file using template module to remote modules
      template:
       src: files/devops-info.j2
       dest: /var/www/html/index.html
      notify: RestartApacheWebServer

    - name: Download file from internet
      get_url:
       url: https://gist.githubusercontent.com/chrisvfritz/bc010e6ed25b802da7eb/raw/18eaa48addae7e3021f6bcea03b7a6557e3f0132/index.html
       dest: /var/www/html/copy.html 
       force_basic_auth: yes
   
  handlers:
    - name: RestartApacheWebServer
      service:
       name: apache2
       state: restarted
